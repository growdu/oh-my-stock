# =============================================================
# oh-my-stock · 一键启动
#   docker compose up -d
# 端口：
#   前端:  http://localhost:5173
#   后端:  http://localhost:3003
#   PG:    localhost:5432
# =============================================================
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-please_change_me_in_prod}
      POSTGRES_DB:       ${DB_NAME:-oh_my_stock}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_table.sql:/docker-entrypoint-initdb.d/01_create.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"

  frontend:
    restart: unless-stopped
    image: nginx:1.27-alpine
    volumes:
      - ./front/dist:/usr/share/nginx/html
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "5173:80"

  # 初始化任务：跑完一次 DDL + 物化视图就退出
  init-mv:
    env_file:
      - .env
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/refresh_mv.sql:/tmp/refresh_mv.sql:ro
    entrypoint:
      - sh
      - -c
      - |
        PGPASSWORD=$${DB_PASS:-please_change_me_in_prod}
        psql -h postgres -U $${DB_USER:-postgres} -d $${DB_NAME:-oh_my_stock} -v ON_ERROR_STOP=1 -f /tmp/refresh_mv.sql
    restart: "no"

volumes:
  pgdata:
